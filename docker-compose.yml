services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto,net
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_FORWARD_SECRET: ${TELEGRAM_FORWARD_SECRET:-}
      ALLOWED_CHAT_ID: ${ALLOWED_CHAT_ID:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      JOB_LOCATION: ${JOB_LOCATION:-Warszawa}
      CV_SOURCE: ${CV_SOURCE:-file}
      SHEET_ID: ${SHEET_ID:-}
      GOOGLE_DRIVE_CV_FILE_ID: ${GOOGLE_DRIVE_CV_FILE_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
      - ./data:/data:ro
      - ./tests:/tests:ro

  cloudflared:
    profiles: ["quick-tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n

  telegram-poller:
    profiles: ["telegram-poller"]
    build:
      context: ./services/telegram-poller
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_FORWARD_SECRET: ${TELEGRAM_FORWARD_SECRET:-}
      N8N_WEBHOOK_URL_INTERNAL: http://n8n:5678/webhook/telegram-updates
      ALLOWED_CHAT_ID: ${ALLOWED_CHAT_ID:-}
      BOT_DEFAULT_LANGUAGE: ${BOT_DEFAULT_LANGUAGE:-pl}
      JOB_LOCATION: ${JOB_LOCATION:-Warszawa, Poland}
      OFFSET_FILE: /state/offset
      LANGUAGE_FILE: /state/languages.json
      POLL_TIMEOUT_SECONDS: "50"
    depends_on:
      - n8n
    volumes:
      - telegram_poller_state:/state

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    expose:
      - "3000"

volumes:
  n8n_data:
  telegram_poller_state:
